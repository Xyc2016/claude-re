name: Build and report hashes

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and compile
        run: |
          npm run check
          npm run build
          node dist/index.js --version
      - name: Run behavior tests
        run: npm test
      - name: Create deterministic build archive
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -czf claude-re-build.tar.gz dist package.json package-lock.json README.md
          sha256sum dist/index.js dist/*.js claude-re-build.tar.gz | tee SHA256SUMS
      - name: Upload build and hashes
        uses: actions/upload-artifact@v4
        with:
          name: claude-re-build-${{ github.sha }}
          path: |
            claude-re-build.tar.gz
            SHA256SUMS
